    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.battleship.backend.match.LeaderboardChecks'
    workingDir rootProject.projectDir
    onlyIf { providers.gradleProperty('leaderboardDatabase').isPresent() }
    environment 'DB_NAME', providers.gradleProperty('leaderboardDatabase').getOrElse('')
}

