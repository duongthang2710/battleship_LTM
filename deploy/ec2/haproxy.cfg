global
    log /dev/log local0
    user haproxy
    group haproxy
    maxconn 256
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend battleship_public
    bind 0.0.0.0:2209 ssl crt /etc/haproxy/battleship.pem
    default_backend battleship_local

backend battleship_local
    server game 127.0.0.1:2210
